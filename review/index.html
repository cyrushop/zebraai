<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>HK Pipeline Weekly Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky control bar, then seven numbered report blocks in one scroll; each block = summary row, then charts, then detail tables. */
:root {
  --bg: #f4f6f9; --surface: #ffffff; --surface-2: #eef1f5; --ink: #13171d; --muted: #586172; --faint: #8a93a3; --line: #dce1e8;
  --accent: #1c5cab; --accent-soft: #e3eefb;
  --good: #1a7f37; --good-bg: #e2f4e6; --warn: #9a6200; --warn-bg: #fdf0d5; --bad: #b42318; --bad-bg: #fde7e4; --idle: #586172; --idle-bg: #eceff3;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #a7adb8;
  --st1: #104281; --st2: #1c5cab; --st3: #2a78d6; --st4: #5598e7; --st5: #86b6ef;
  --hero: #13171d; --hero-ink: #ffffff;
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", "Noto Sans HK", "PingFang HK", "Microsoft JhengHei", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1116; --surface: #161a21; --surface-2: #1d222b; --ink: #eceef2; --muted: #a3abb8; --faint: #747d8c; --line: #2a313c;
  --accent: #6da7ec; --accent-soft: #19283c;
  --good: #5cc97a; --good-bg: #133020; --warn: #e3a63a; --warn-bg: #33280f; --bad: #f2877c; --bad-bg: #3a1a17; --idle: #a3abb8; --idle-bg: #232933;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #5d6573;
  --st1: #9ec5f4; --st2: #6da7ec; --st3: #3987e5; --st4: #256abf; --st5: #184f95;
  --hero: #1f3554; --hero-ink: #eceef2;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1116; --surface: #161a21; --surface-2: #1d222b; --ink: #eceef2; --muted: #a3abb8; --faint: #747d8c; --line: #2a313c;
  --accent: #6da7ec; --accent-soft: #19283c;
  --good: #5cc97a; --good-bg: #133020; --warn: #e3a63a; --warn-bg: #33280f; --bad: #f2877c; --bad-bg: #3a1a17; --idle: #a3abb8; --idle-bg: #232933;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #5d6573;
  --st1: #9ec5f4; --st2: #6da7ec; --st3: #3987e5; --st4: #256abf; --st5: #184f95;
  --hero: #1f3554; --hero-ink: #eceef2;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
.num, td.r, .tile b { font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* masthead */
.mast { background: var(--surface); border-bottom: 1px solid var(--line); }
.mast .wrap { padding-block: 20px 16px; display: flex; flex-wrap: wrap; gap: 12px 32px; align-items: flex-end; justify-content: space-between; }
.mast h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.01em; }
.mast .sub { color: var(--muted); margin-top: 2px; }
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }

.sources { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; flex: 1 1 640px; max-width: 820px; }
.src { border: 1px dashed var(--line); border-radius: 8px; padding: 8px 10px; display: flex; gap: 10px; align-items: center; background: var(--bg); min-width: 0; }
.src.drag { border-color: var(--accent); background: var(--accent-soft); }
.src .meta { min-width: 0; flex: 1; }
.src .lbl { font-size: 11px; font-family: var(--f-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.src .fn { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.src .info { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.src .info.err { color: var(--bad); white-space: normal; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.primary:hover { filter: brightness(1.08); color: var(--surface); }
.sample { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--warn-bg); color: var(--warn); font-weight: 600; margin-left: 4px; }

/* control bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
.bar .wrap { padding-block: 8px; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
.ctl { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.ctl select, .ctl input { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 4px 6px; color: var(--ink); }
.ctl input { width: 110px; text-align: right; font-family: var(--f-mono); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; font-size: 12px; cursor: pointer; background: var(--surface); color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
nav.jump { display: flex; gap: 2px; overflow-x: auto; margin-left: auto; max-width: 100%; }
nav.jump a { color: var(--muted); text-decoration: none; font-size: 12px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; }
nav.jump a:hover { background: var(--surface-2); color: var(--ink); }
nav.jump a b { font-family: var(--f-mono); color: var(--accent); font-weight: 500; margin-right: 3px; }

/* sections */
main .wrap { padding-block: 20px 60px; display: grid; gap: 28px; }
section.blk { scroll-margin-top: 70px; display: grid; gap: 14px; min-width: 0; }
.bh { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; border-bottom: 2px solid var(--ink); padding-bottom: 6px; }
.bh .n { font-family: var(--f-mono); font-size: 13px; color: var(--accent); }
.bh h2 { font-size: 21px; font-weight: 700; }
.bh .note { color: var(--muted); font-size: 13px; margin-left: auto; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: 5fr 7fr; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; display: grid; gap: 10px; align-content: start; }
.card h3 { font-size: 15px; font-weight: 700; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 10px; align-items: baseline; }
.card h3 small { font-family: var(--f-body); font-weight: 400; color: var(--muted); font-size: 12px; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 2px; align-content: start; }
.tile span { font-size: 12px; color: var(--muted); }
.tile b { font-family: var(--f-display); font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
.tile em { font-style: normal; font-size: 12px; color: var(--muted); }
.tile.hero { background: var(--hero); color: var(--hero-ink); border-color: var(--hero); }
.tile.hero span, .tile.hero em { color: color-mix(in srgb, var(--hero-ink) 72%, var(--hero)); }

.pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.good { background: var(--good-bg); color: var(--good); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.idle { background: var(--idle-bg); color: var(--idle); }
.pill.acc { background: var(--accent-soft); color: var(--accent); }

.tbl { overflow-x: auto; min-width: 0; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 600; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); padding: 6px 8px; white-space: nowrap; }
td { border-bottom: 1px solid var(--line); padding: 6px 8px; vertical-align: top; }
td.r, th.r { text-align: right; white-space: nowrap; font-family: var(--f-mono); font-size: 12.5px; }
th.r { font-family: var(--f-body); font-size: 11px; }
tr.tot td { font-weight: 600; border-top: 1px solid var(--ink); border-bottom: none; }
td.rk { color: var(--faint); font-family: var(--f-mono); width: 1%; }
td .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: 1px; }
td input.key { width: 150px; border: 1px solid var(--line); border-radius: 4px; padding: 2px 5px; background: var(--warn-bg); font-family: var(--f-mono); font-size: 12px; }
td input.key.auto { background: var(--surface-2); }
.dim { color: var(--muted); }
.small { font-size: 12px; color: var(--muted); }
th.grp { text-align: center; border-bottom: none; padding-bottom: 0; }
th.val, td.val { background: var(--warn-bg); color: var(--warn); font-style: italic; }
td.sec { font-weight: 600; }
.pill.val-pill { background: var(--warn-bg); color: var(--warn); font-style: italic; font-size: 11px; }
.badge { display: inline-block; margin-left: 4px; padding: 0 5px; border-radius: 999px; background: var(--bad); color: var(--surface); font-size: 10px; font-weight: 700; line-height: 16px; }
.alert { border: 1px solid var(--bad); background: var(--bad-bg); border-radius: 10px; padding: 12px 16px; display: grid; gap: 4px; }
.alert b { color: var(--bad); font-family: var(--f-display); font-size: 16px; }
.alert span { color: var(--ink); font-size: 13px; }
td.miss { color: var(--bad); font-weight: 600; background: var(--bad-bg); }
td.ok { color: var(--good); }
.rad { display: inline-block; min-width: 22px; text-align: center; padding: 1px 6px; border-radius: 4px; font-weight: 700; font-size: 12px; font-family: var(--f-mono); }
.rad-R { background: var(--accent-soft); color: var(--accent); } .rad-A { background: var(--good-bg); color: var(--good); } .rad-D { background: var(--warn-bg); color: var(--warn); } .rad-x { background: var(--idle-bg); color: var(--idle); }
.grid-rad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 1100px) { .grid-rad { grid-template-columns: minmax(0, 1fr); } }
.rules { background: var(--surface-2); border-radius: 8px; padding: 8px 12px; }
.rules b { color: var(--ink); }
.neg { color: var(--bad); } .pos { color: var(--good); }

.chartbox { position: relative; min-width: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

/* coverage bar */
.cov { display: grid; gap: 6px; }
.cov .track { position: relative; height: 30px; margin-top: 18px; display: flex; gap: 2px; border-radius: 4px; background: var(--surface-2); }
.cov .seg { height: 100%; min-width: 0; }
.cov .seg:first-child { border-radius: 4px 0 0 4px; }
.cov .tgt { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--ink); }
.cov .tgt::after { content: attr(data-l); position: absolute; top: -18px; transform: translateX(-50%); font-size: 11px; font-family: var(--f-mono); color: var(--ink); white-space: nowrap; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 0; }
.kv > div { display: contents; }
.kv span, .kv b { padding: 5px 0; border-bottom: 1px solid var(--line); }
.kv b { text-align: right; font-family: var(--f-mono); font-weight: 500; font-size: 13px; }
.kv .hl span, .kv .hl b { font-weight: 700; color: var(--ink); }
.kv .ind span { padding-left: 14px; color: var(--muted); }
details > summary { cursor: pointer; font-weight: 600; color: var(--accent); }
details[open] > summary { margin-bottom: 8px; }
.empty { padding: 18px; text-align: center; color: var(--muted); background: var(--surface-2); border-radius: 8px; }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--surface); padding: 10px 14px; border-radius: 8px; font-size: 13px; z-index: 20; max-width: 360px; }

@media (max-width: 900px) { .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); } .sources { grid-template-columns: minmax(0, 1fr); } nav.jump { margin-left: 0; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<header class="mast">
  <div class="wrap">
    <div>
      <div class="eyebrow">Zebra · Hong Kong · SFDC pipeline</div>
      <h1>HK Pipeline Weekly Review</h1>
      <div class="sub" id="asof">Drop a new SFDC pipeline export to rebuild every section.</div>
    </div>
    <div class="sources">
      <div class="src" id="src-pipe" data-kind="pipe"><div class="meta"><div class="lbl">1 · SFDC pipeline <b>(required)</b></div><div class="fn"></div><div class="info"></div></div><label class="btn primary" for="f-pipe">Upload</label><input type="file" id="f-pipe" accept=".xls,.xlsx,.csv,.html,.htm" hidden></div>
      <div class="src" id="src-pos" data-kind="pos"><div class="meta"><div class="lbl">2 · POS export or tracker</div><div class="fn"></div><div class="info"></div></div><label class="btn" for="f-pos">Upload</label><input type="file" id="f-pos" accept=".xls,.xlsx,.xlsm,.csv" hidden></div>
      <div class="src" id="src-acct" data-kind="acct"><div class="meta"><div class="lbl">3 · Account list (NAL / MPL)</div><div class="fn"></div><div class="info"></div></div><label class="btn" for="f-acct">Upload</label><input type="file" id="f-acct" accept=".xls,.xlsx,.csv" hidden></div>
    </div>
  </div>
</header>

<div class="bar">
  <div class="wrap">
    <label class="ctl" for="c-q">Current Q <select id="c-q"></select></label>
    <label class="ctl" for="c-target">Q target US$ <input id="c-target" inputmode="numeric"></label>
    <label class="ctl" for="c-period">Period (Disti onward) <select id="c-period">
      <option value="cn">Current + next Q</option><option value="cur">Current Q</option><option value="next">Next Q</option><option value="fwd">Current Q onward</option>
    </select></label>
    <div class="ctl"><span>Stages</span><div class="chips" id="c-stages"></div></div>
    <div class="ctl"><button type="button" class="chip" id="c-hidef" title="Leave out opportunities whose name ends in -F (placeholders) from the business sections; the -F section totals them separately">Hide -F placeholders</button></div>
    <nav class="jump" aria-label="Sections" id="jump"></nav>
  </div>
</div>

<main><div class="wrap" id="out"></div></main>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="engine.js"></script>
<script src="initial-data.js" onerror="window.HKPR_SAMPLE = null"></script>
<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const money = v => v == null || isNaN(v) ? '—' : (v < 0 ? '−' : '') + '$' + Math.abs(v).toLocaleString('en-US', { maximumFractionDigits: 0 });
const kfmt = v => { if (v == null || isNaN(v)) return '—'; const a = Math.abs(v), s = v < 0 ? '−$' : '$'; return a >= 1e6 ? s + (a / 1e6).toFixed(2) + 'M' : a >= 1e3 ? s + (a / 1e3).toFixed(a >= 1e5 ? 0 : 1) + 'K' : s + a.toFixed(0); };
const pct = v => v == null || !isFinite(v) ? '—' : (v * 100).toFixed(1) + '%';
const store = { get(k, d) { try { const v = localStorage.getItem('hkpr.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('hkpr.' + k, JSON.stringify(v)); return true; } catch { return false; } } };
const toast = msg => { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 4000); };

// ---------- state ----------
// Seed data: embedded #sample (artifact build) or window.HKPR_SAMPLE from the git-ignored initial-data.js.
const SAMPLE = window.HKPR_SAMPLE || (() => { try { return JSON.parse($('#sample')?.textContent || 'null'); } catch { return null; } })();
const S = {
  pipe: null, pos: null, acct: null, keys: {}, sampleKeys: SAMPLE?.keys || {},
  curQ: null, target: store.get('target', SAMPLE?.target || 0),
  period: store.get('period', 'cn'),
  hideF: store.get('hideF', true),
  stages: new Set(store.get('stages', ['Closed - Won', 'Secure', 'Validate', 'Qualify', 'Identify'])),
};
S.keys = store.get('keys', {});

function loadSample(kind) {
  if (!SAMPLE) return;
  if (kind === 'pipe') S.pipe = { name: SAMPLE.pipe.name, rows: ENG.parsePipeline([SAMPLE.pipe.cols, ...SAMPLE.pipe.rows]), sample: true };
  if (kind === 'pos') S.pos = { name: SAMPLE.pos.name, rows: ENG.parsePOS([SAMPLE.pos.cols, ...SAMPLE.pos.rows]), sample: true };
  if (kind === 'acct') S.acct = { name: SAMPLE.acct.name, rows: ENG.parseAccounts([['Type', 'Account Name', 'Account ID USD', 'Region', 'FY26 RAD', 'FY27 Projection'], ...SAMPLE.acct.rows]), sample: true };
}
for (const k of ['pipe', 'pos', 'acct']) { const saved = store.get('data.' + k, null); if (saved && saved.rows && (k !== 'acct' || 'rad' in (saved.rows[0] || {})) && (k !== 'pos' || 'region' in (saved.rows[0] || {}))) S[k] = saved; else loadSample(k); }

// ---------- file reading ----------
async function readRows(file) {
  const buf = await file.arrayBuffer();
  const head = new TextDecoder('windows-1252').decode(buf.slice(0, 512)).trimStart();
  if (head.startsWith('<')) {   // SFDC "Export Details" .xls is an HTML table
    const doc = new DOMParser().parseFromString(new TextDecoder('windows-1252').decode(buf), 'text/html');
    const t = doc.querySelector('table'); if (!t) throw new Error('No table found in file.');
    return { sheets: [{ name: 'table', rows: [...t.rows].map(tr => [...tr.cells].map(c => c.textContent.trim())) }] };
  }
  const wb = XLSX.read(buf, { type: 'array', cellDates: false });
  return { wb, sheets: wb.SheetNames.map(n => ({ name: n, rows: XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: '' }) })) };
}
function firstParse(sheets, fn, prefer) {
  const order = prefer ? [...sheets].sort((a, b) => (b.name === prefer) - (a.name === prefer)) : sheets;
  let err;
  for (const s of order) { try { const r = fn(s.rows); if (r.length) return r; } catch (e) { err = e; } }
  throw err || new Error('No usable rows found.');
}
async function handleFile(kind, file) {
  const box = $('#src-' + kind);
  box.querySelector('.info').className = 'info'; box.querySelector('.info').textContent = 'Reading…';
  try {
    const { sheets, wb } = await readRows(file);
    if (kind === 'pipe') {
      const rows = firstParse(sheets, ENG.parsePipeline);
      S.pipe = { name: file.name, rows };
      const m = file.name.match(/(\d{4})-(\d{2})-(\d{2})/);
      S.curQ = m ? ENG.qFromDate(new Date(+m[1], +m[2] - 1, +m[3])) : ENG.qFromDate(new Date());
    } else if (kind === 'pos') {
      // read every sheet with POS columns (a tracker has one, a POS export may have HK and TW), keep Hong Kong rows
      const all = sheets.flatMap(s => { try { return ENG.parsePOS(s.rows); } catch { return []; } });
      if (!all.length) firstParse(sheets, ENG.parsePOS);   // throws the missing-column message
      const rows = all.filter(ENG.isHKPos);
      if (!rows.length) throw new Error('No Hong Kong rows found (262H Region / Submitting Country).');
      S.pos = { name: file.name, rows, skipped: all.length - rows.length };

  out.push(`<section class="blk" id="s3"><div class="bh"><span class="n">03</span><h2>Top 10 partners</h2><span class="note">Primary channel partner, stacked by sales stage</span></div>

    const sums = cols.map((_, i) => lines.reduce((s, l) => s + l.v[i], 0));
    return `<div class="card"><h3>Product line totals · Secure <small>${qList.join(' and ')} · <span class="pill val-pill">Validate</span> shown separately, not in Secure totals${S.hideF ? ' · excl. -F' : ''}</small></h3><div class="tbl"><table class="pl"><thead>
      <tr><th rowspan="2">Product line</th>${[...qList, 'Total'].map(q => `<th class="r grp" colspan="2">${q}</th>`).join('')}</tr>
      <tr>${cols.map(([, st]) => st === 'Validate' ? '<th class="r val">Validate</th>' : '<th class="r">Secure</th>').join('')}</tr></thead><tbody>
      ${lines.map(l => `<tr><td><span class="sw" style="background:${plColor(l.key)}"></span>${esc(l.key)}</td>${l.v.map((v, i) => cell(v, cols[i][1], cols[i][0] === 'Total')).join('')}</tr>`).join('')}
      <tr class="tot"><td>Total</td>${sums.map((v, i) => cell(v, cols[i][1], false)).join('')}</tr></tbody></table></div></div>`;
  }

  // ===== 4. Chinetek & VST =====
  const DIST = ['Chinetek', 'VST'], distCol = { Chinetek: css('--s1'), VST: css('--s2') };
  const D = P.filter(r => DIST.includes(ENG.distOf(r)));
  const dTot = Object.fromEntries(DIST.map(d => [d, ENG.total(D.filter(r => ENG.distOf(r) === d))]));
  const dAll = dTot.Chinetek + dTot.VST;
  const others = ENG.group(P.filter(r => !DIST.includes(ENG.distOf(r))), r => r.dist || 'No distributor (direct)');
  const dStage = d => ENG.group(D.filter(r => ENG.distOf(r) === d), r => r.stage).reduce((m, x) => m.set(x.key, x.amt), new Map());
  const dQ = d => ENG.group(D.filter(r => ENG.distOf(r) === d), r => r.q).reduce((m, x) => m.set(x.key, x.amt), new Map());
  const dPL = ENG.group(D, r => r.pl, r => ENG.distOf(r)).slice(0, 10);
  const DQ = F.filter(r => fwdQs.includes(r.q) && DIST.includes(ENG.distOf(r)));
  const dq = (d, q) => ENG.total(DQ.filter(r => ENG.distOf(r) === d && r.q === q));
  out.push(`<section class="blk" id="s4"><div class="bh"><span class="n">04</span><h2>Chinetek and VST total pipeline</h2><span class="note">${esc(periodLabel)} · ${stageNoteF} · by Primary Distributor</span></div>
    <div class="grid3">
      <div class="card"><h3>Share of disti pipeline <small>${money(dAll)}</small></h3>
        <div class="chartbox" style="height:240px"><canvas id="ch-dist" aria-label="Chinetek vs VST pie chart"></canvas></div>
        ${legendHTML(DIST.map(d => [`${d} ${kfmt(dTot[d])} · ${pct(dAll ? dTot[d] / dAll : null)}`, distCol[d]]))}
        ${others.length ? `<p class="small">Not in this chart: ${others.map(o => `${esc(o.key)} ${kfmt(o.amt)}`).join(' · ')}</p>` : ''}
      </div>
      <div class="card"><h3>By stage and quarter</h3><div class="tbl"><table><thead><tr><th></th>${DIST.map(d => `<th class="r"><span class="sw" style="background:${distCol[d]}"></span>${d}</th>`).join('')}<th class="r">Total</th></tr></thead><tbody>
        ${stKeys.map(s => { const v = DIST.map(d => dStage(d).get(s) || 0); return v.some(x => x) ? `<tr><td>${esc(s)}</td>${v.map(x => `<td class="r">${money(x)}</td>`).join('')}<td class="r">${money(v[0] + v[1])}</td></tr>` : ''; }).join('')}
        <tr class="tot"><td>Total</td>${DIST.map(d => `<td class="r">${money(dTot[d])}</td>`).join('')}<td class="r">${money(dAll)}</td></tr>
        ${periodQs.length > 1 ? periodQs.map(q => { const v = DIST.map(d => dQ(d).get(q) || 0); return `<tr><td class="dim">${q}</td>${v.map(x => `<td class="r dim">${money(x)}</td>`).join('')}<td class="r dim">${money(v[0] + v[1])}</td></tr>`; }).join('') : ''}
        </tbody></table></div>
        <h3>Top product lines</h3>
        <div class="chartbox" style="height:${dPL.length * 28 + 40}px"><canvas id="ch-distpl"></canvas></div>
      </div>
    </div>
    <div class="card"><h3>Chinetek and VST total pipeline by quarter <small>${esc(S.curQ)} onward · ${stageNoteF}</small></h3>
      ${legendHTML(DIST.map(d => [d, distCol[d]]))}
      <div class="chartbox" style="height:${fwdQs.length * 34 + 40}px"><canvas id="ch-distq"></canvas></div>
      <div class="tbl"><table><thead><tr><th>Quarter</th>${DIST.map(d => `<th class="r"><span class="sw" style="background:${distCol[d]}"></span>${d}</th>`).join('')}<th class="r">Total</th><th class="r">Chinetek share</th><th class="r">VST share</th></tr></thead><tbody>
      ${fwdQs.map(q => { const c = dq('Chinetek', q), v = dq('VST', q), s = c + v; return `<tr><td>${q}</td><td class="r">${money(c)}</td><td class="r">${money(v)}</td><td class="r sec">${money(s)}</td><td class="r">${pct(s ? c / s : null)}</td><td class="r">${pct(s ? v / s : null)}</td></tr>`; }).join('')}
      ${(() => { const c = ENG.total(DQ.filter(r => ENG.distOf(r) === 'Chinetek')), v = ENG.total(DQ.filter(r => ENG.distOf(r) === 'VST')), s = c + v; return `<tr class="tot"><td>Total</td><td class="r">${money(c)}</td><td class="r">${money(v)}</td><td class="r">${money(s)}</td><td class="r">${pct(s ? c / s : null)}</td><td class="r">${pct(s ? v / s : null)}</td></tr>`; })()}
      </tbody></table></div></div></section>`);

  // ===== 5. Software =====
  const SW = P.filter(ENG.isSoftware), swTot = ENG.total(SW);
  const swFam = ENG.group(SW, r => r.fam || r.psl || r.pl);
  const swOpp = ENG.group(SW, r => r.opp).map(x => { const r0 = SW.find(r => r.opp === x.key); return { ...x, r0 }; });
  const swQ = ENG.group(SW, r => r.q).sort((a, b) => ENG.qCmp(a.key, b.key));
  out.push(`<section class="blk" id="s5"><div class="bh"><span class="n">05</span><h2>Total software pipeline</h2><span class="note">${esc(periodLabel)} · ${stageNoteF} · Product Line or Sub Line contains “Software”</span></div>

      <div class="card"><h3>Software opportunities <small>${swOpp.length}</small></h3><div class="tbl"><table><thead><tr><th>Opportunity</th><th>End user</th><th>Partner</th><th>Stage</th><th>Q</th><th class="r">Amount</th></tr></thead><tbody>

        <tr class="tot"><td colspan="5">Total</td><td class="r">${money(swTot)}</td></tr></tbody></table></div></div>
    </div></section>`);

  // ===== 6 & 7. NAL / MPL =====
  // ===== RFID business by quarter =====
  const isRFID = r => /rfid/i.test(r.pl) || /rfid/i.test(r.psl);
  const RF = F.filter(r => isRFID(r) && fwdQs.includes(r.q)), rfTot = ENG.total(RF);

  const rfColor = k => { const i = rfSub.indexOf(k); return css(i >= 0 && i < SLOTS.length ? SLOTS[i] : '--s8'); };
  const rfEU = ENG.group(RF, r => r.acct).slice(0, 10).map(x => x.key);
  const rfPT = ENG.group(RF, r => r.partner || '(No channel partner)').slice(0, 10).map(x => x.key);
  const allFwd = ENG.total(F.filter(r => fwdQs.includes(r.q)));
  out.push(`<section class="blk" id="srfid"><div class="bh"><span class="n"></span><h2>RFID business by quarter</h2><span class="note">${esc(S.curQ)} onward · ${stageNoteF} · Product Line or Sub Line contains “RFID”</span></div>
    <div class="tiles"><div class="tile hero"><span>RFID pipeline</span><b>${kfmt(rfTot)}</b><em>${ENG.group(RF, r => r.opp).length} opps · ${pct(allFwd ? rfTot / allFwd : null)} of all pipeline</em></div>
      ${fwdQs.map(q => { const rq = RF.filter(r => r.q === q); return `<div class="tile"><span>${q}</span><b>${kfmt(ENG.total(rq))}</b><em>${ENG.group(rq, r => r.opp).length} opps · Secure ${kfmt(ENG.total(rq.filter(r => r.stage === 'Secure')))}</em></div>`; }).join('')}</div>
    <div class="card"><h3>RFID by quarter, stacked by sub line</h3>
      ${legendHTML(rfSub.map(k => [k, rfColor(k)]))}
      <div class="chartbox" style="height:${fwdQs.length * 34 + 40}px"><canvas id="ch-rfq"></canvas></div>
      ${byQTable(RF, r => r.psl || r.pl, rfSub, rfColor, 'Sub line')}</div>
    <div class="card"><h3>RFID by stage and quarter</h3>${byQTable(RF, r => r.stage, ENG.STAGES.filter(s => RF.some(r => r.stage === s)), s => css(STAGE_COL[s]), 'Stage')}</div>
    <div class="grid2">
      <div class="card"><h3>Top 10 RFID end users <small>by quarter</small></h3>${byQTable(RF.filter(r => rfEU.includes(r.acct)), r => r.acct, rfEU, null, 'End user', rfTot)}</div>
      <div class="card"><h3>Top 10 RFID partners <small>by quarter</small></h3>${byQTable(RF.filter(r => rfPT.includes(r.partner || '(No channel partner)')), r => r.partner || '(No channel partner)', rfPT, null, 'Partner', rfTot)}</div>
    </div></section>`);

  // ----- 6 & 7. NAL / MPL -----
  // Two separate readings of the same pipeline:
  //   Coverage = "does the account have any pipeline": every live stage (incl. Qualify, Identify) and -F placeholders count.
  //   Forecast = real business: Closed-Won + Secure + Validate only, -F never counts.
  const COV_ST = ['Closed - Won', 'Secure', 'Validate', 'Qualify', 'Identify'], FC_ST = ['Closed - Won', 'Secure', 'Validate'];
  const isF = r => ENG.tagOf(r.name) === 'F';
  const isFc = r => FC_ST.includes(r.stage) && !isF(r);
  const RADS = [['R', 'Retain'], ['A', 'Acquire'], ['D', 'Develop']];
  const radTag = r => `<span class="rad rad-${r || 'x'}">${r || '—'}</span>`;
  const q2 = ENG.qAdd(S.curQ, 2), covQs = [S.curQ, nextQ, q2];
  const kindOf = r => isF(r) ? '-F' : r.stage === 'Qualify' || r.stage === 'Identify' ? r.stage : null;

  const acctSection = (n, type, title, idFn, nameFn, matchNote) => {
    const id = type.toLowerCase();
    const idx = ENG.accountIndex(hkAcct, type);
    if (!idx.size) return { html: `<section class="blk" id="s${n}"><div class="bh"><span class="n">0${n}</span><h2>${title}</h2></div><div class="empty">No HK ${type} accounts in the account list. Upload the FY27 account file.</div></section>`, draw() {}, alerts: 0 };
    const acctOf = r => idx.find(idFn(r), nameFn(r));
    const covAll = pipe.filter(r => COV_ST.includes(r.stage) && acctOf(r));
    const fcAll = covAll.filter(isFc);
    const fc = fcAll.filter(r => periodQs.includes(r.q)), covP = covAll.filter(r => periodQs.includes(r.q));
    const fcTot = ENG.total(fc), covTot = ENG.total(covP);
    const sumBy = (rows, f) => rows.reduce((m, r) => { const k = f(r); m.set(k, (m.get(k) || 0) + r.amt); return m; }, new Map());
    const covAQ = sumBy(covAll, r => acctOf(r).name + '|' + r.q), fcAQ = sumBy(fcAll, r => acctOf(r).name + '|' + r.q);
    const kindsAQ = new Map(); covAll.forEach(r => { const k = kindOf(r); if (!k) return; const key = acctOf(r).name + '|' + r.q; if (!kindsAQ.has(key)) kindsAQ.set(key, new Set()); kindsAQ.get(key).add(k); });
    const covA = sumBy(covP, r => acctOf(r).name), fcA = sumBy(fc, r => acctOf(r).name);
    const laterQ = new Map(); covAll.filter(r => r.q > q2).forEach(r => { const a = acctOf(r).name; if (!laterQ.has(a) || r.q < laterQ.get(a)) laterQ.set(a, r.q); });
    const radOf = a => (RADS.some(x => x[0] === a.rad) ? a.rad : '');
    const cov = idx.list.map(a => ({ a, rad: radOf(a), q: covQs.map(q => covAQ.get(a.name + '|' + q) || 0), f: covQs.map(q => fcAQ.get(a.name + '|' + q) || 0), k: covQs.map(q => kindsAQ.get(a.name + '|' + q)) }));
    const missNext = cov.filter(c => !c.q[1]), missQ2 = cov.filter(c => !c.q[2]);
    const alerts = cov.filter(c => !c.q[1] || !c.q[2]).sort((x, y) => (!!x.q[1] + !!x.q[2]) - (!!y.q[1] + !!y.q[2]) || 'RAD'.indexOf(x.rad || 'Z') - 'RAD'.indexOf(y.rad || 'Z') || y.a.proj - x.a.proj);
    const softOnly = cov.filter(c => c.q[1] && c.q[2] && [1, 2].some(i => !c.f[i]));
    const groups = [...RADS, ...(cov.some(c => !c.rad) ? [['', 'No RAD']] : [])];
    const dist = groups.map(([r, label]) => {
      const cs = cov.filter(c => c.rad === r);
      return { r, label, n: cs.length, withP: cs.filter(c => covA.get(c.a.name)).length, fc: cs.reduce((s, c) => s + (fcA.get(c.a.name) || 0), 0), cov: cs.reduce((s, c) => s + (covA.get(c.a.name) || 0), 0),
        q: covQs.map((_, i) => cs.reduce((s, c) => s + c.f[i], 0)), mNext: cs.filter(c => !c.q[1]).length, mQ2: cs.filter(c => !c.q[2]).length, proj: cs.reduce((s, c) => s + (c.a.proj || 0), 0) };
    });
    const sumD = k => dist.reduce((s, d) => s + d[k], 0);
    const stg = st => ENG.total(fc.filter(r => r.stage === st));
    const covCell = (c, i) => {
      if (!c.q[i]) return '<td class="r miss">None</td>';
      if (c.f[i]) return `<td class="r">${money(c.q[i])}</td>`;
      return `<td class="r"><span class="pill warn" title="No forecast-grade pipeline this quarter">${[...(c.k[i] || [])].join(' / ')} only</span> ${money(c.q[i])}</td>`;
    };
    const radCards = RADS.map(([r, label]) => {
      const rows = fc.filter(x => acctOf(x).rad === r), g = ENG.group(rows, x => acctOf(x).name, x => plName(x.pl)), top = g.slice(0, 5), rt = ENG.total(rows);
      return { r, top, html: `<div class="card"><h3><span>${radTag(r)} ${label} · top 5</span><small>forecast ${money(rt)} · ${g.length} of ${cov.filter(c => c.rad === r).length} accounts</small></h3>
        ${top.length ? `<div class="chartbox" style="height:${top.length * 30 + 36}px"><canvas id="ch-${id}-${r}"></canvas></div>
        <div class="tbl"><table><thead><tr><th></th><th>Account</th><th class="r">Forecast</th><th class="r">Share</th><th class="r">Opps</th></tr></thead><tbody>
        ${top.map((x, i) => `<tr><td class="rk">${i + 1}</td><td>${esc(x.key)}<div class="small">${esc(topSub(x))}</div></td><td class="r">${money(x.amt)}</td><td class="r">${pct(rt ? x.amt / rt : null)}</td><td class="r">${x.n}</td></tr>`).join('')}
        </tbody></table></div>` : `<div class="empty">No ${label} forecast in ${esc(periodLabel)}.</div>`}</div>` };
    });
    const html = `<section class="blk" id="s${n}"><div class="bh"><span class="n">0${n}</span><h2>${title}</h2><span class="note">${esc(periodLabel)} · ${matchNote} · RAD from account list</span></div>
      <div class="rules small"><b>Coverage</b> (has pipeline?) counts every live stage incl. Qualify, Identify and -F. <b>Forecast</b> (real business) counts Closed-Won + Secure + Validate only, never -F. Stage chips and the -F switch do not change this section.</div>
      ${alerts.length ? `<div class="alert"><b>${alerts.length} of ${idx.size} ${type} accounts have no pipeline in ${esc(nextQ)} and/or ${esc(q2)}</b><span>Every account must carry pipeline. ${missNext.length} missing ${esc(nextQ)} · ${missQ2.length} missing ${esc(q2)} · ${cov.filter(c => !c.q[1] && !c.q[2]).length} missing both. ${softOnly.length} more are covered only by -F / Qualify / Identify. Full list below.</span></div>` : `<div class="alert" style="border-color:var(--good);background:var(--good-bg)"><b style="color:var(--good)">Every ${type} account has pipeline in ${esc(nextQ)} and ${esc(q2)}</b></div>`}
      <div class="tiles"><div class="tile hero"><span>${type} forecast</span><b>${kfmt(fcTot)}</b><em>C-Won ${kfmt(stg('Closed - Won'))} · Secure ${kfmt(stg('Secure'))} · Validate ${kfmt(stg('Validate'))}</em></div>
        <div class="tile"><span>${type} coverage pipeline</span><b>${kfmt(covTot)}</b><em>incl. -F ${kfmt(ENG.total(covP.filter(isF)))} · Q/I ${kfmt(ENG.total(covP.filter(r => !isF(r) && (r.stage === 'Qualify' || r.stage === 'Identify'))))}</em></div>
        <div class="tile"><span>Accounts with pipeline</span><b>${covA.size} / ${idx.size}</b><em>${fcA.size} with forecast · ${esc(periodLabel)}</em></div>
        <div class="tile"><span>No pipeline ${esc(nextQ)}</span><b class="${missNext.length ? 'neg' : 'pos'}">${missNext.length}</b><em>accounts</em></div>
        <div class="tile"><span>No pipeline ${esc(q2)}</span><b class="${missQ2.length ? 'neg' : 'pos'}">${missQ2.length}</b><em>accounts</em></div></div>
      <div class="card"><h3>${type} RAD distribution <small>forecast columns exclude -F and Qualify/Identify · coverage counts include them</small></h3><div class="tbl"><table><thead>
        <tr><th>RAD</th><th class="r"># Accounts</th><th class="r">With pipeline</th><th class="r">Forecast (period)</th><th class="r">Share</th>${covQs.map(q => `<th class="r">Forecast ${q}</th>`).join('')}<th class="r">Coverage (period)</th><th class="r">No pipe ${esc(nextQ)}</th><th class="r">No pipe ${esc(q2)}</th><th class="r">FY27 projection</th></tr></thead><tbody>
        ${dist.map(d => `<tr><td>${radTag(d.r)} ${d.label}</td><td class="r">${d.n}</td><td class="r">${d.withP} <span class="dim">(${pct(d.n ? d.withP / d.n : null)})</span></td><td class="r sec">${money(d.fc)}</td><td class="r">${pct(fcTot ? d.fc / fcTot : null)}</td>${d.q.map(v => `<td class="r">${money(v)}</td>`).join('')}<td class="r dim">${money(d.cov)}</td><td class="r ${d.mNext ? 'neg' : ''}">${d.mNext}</td><td class="r ${d.mQ2 ? 'neg' : ''}">${d.mQ2}</td><td class="r dim">${money(d.proj)}</td></tr>`).join('')}
        <tr class="tot"><td>Total ${type}</td><td class="r">${sumD('n')}</td><td class="r">${sumD('withP')}</td><td class="r">${money(sumD('fc'))}</td><td class="r">100%</td>${covQs.map((_, i) => `<td class="r">${money(dist.reduce((s, d) => s + d.q[i], 0))}</td>`).join('')}<td class="r">${money(sumD('cov'))}</td><td class="r">${missNext.length}</td><td class="r">${missQ2.length}</td><td class="r">${money(sumD('proj'))}</td></tr>
        </tbody></table></div>
        ${legendHTML(covQs.map((q, i) => ['Forecast ' + q, css(['--st2', '--st4', '--st5'][i])]))}
        <div class="chartbox" style="height:${groups.length * 40 + 40}px"><canvas id="ch-${id}-dist" aria-label="${type} forecast by RAD and quarter"></canvas></div></div>
      ${legendHTML(plKeys.map(k => [k, plColor(k === 'Other lines' ? '' : k)]))}
      <div class="grid-rad">${radCards.map(c => c.html).join('')}</div>
      <div class="card"><h3>No-pipeline alert <small>${type} accounts with nothing in ${esc(nextQ)} or ${esc(q2)} (coverage rule) · yellow = covered only by -F / Qualify / Identify</small></h3>
        ${alerts.length ? `<div class="tbl"><table><thead><tr><th>Account</th><th>RAD</th><th class="r">FY27 projection</th>${covQs.map(q => `<th class="r">${q}</th>`).join('')}<th>Missing</th><th>Next later pipeline</th></tr></thead><tbody>
        ${alerts.map(c => `<tr><td>${esc(c.a.name)}</td><td>${radTag(c.rad)}</td><td class="r dim">${c.a.proj ? money(c.a.proj) : '—'}</td>${c.q.map((v, i) => i === 0 ? (v ? covCell(c, 0) : '<td class="r dim">—</td>') : covCell(c, i)).join('')}<td>${!c.q[1] && !c.q[2] ? '<span class="pill bad">Both quarters</span>' : !c.q[1] ? `<span class="pill warn">${esc(nextQ)}</span>` : `<span class="pill warn">${esc(q2)}</span>`}</td><td class="dim">${laterQ.get(c.a.name) || '—'}</td></tr>`).join('')}
        </tbody></table></div>` : '<div class="empty">None. Every account has pipeline in both quarters.</div>'}</div>
    </section>`;
    const draw = () => {
      radCards.forEach(c => c.top.length && hbar(`ch-${id}-${c.r}`, c.top.map(x => x.key.length > 18 ? x.key.slice(0, 17) + '…' : x.key), plKeys.map(k => ({ label: k, backgroundColor: plColor(k === 'Other lines' ? '' : k), data: c.top.map(x => x.sub.get(k) || 0) })).filter(d => d.data.some(v => v))));
      hbar(`ch-${id}-dist`, dist.map(d => `${d.r || '—'} ${d.label}`), covQs.map((q, i) => ({ label: 'Forecast ' + q, backgroundColor: css(['--st2', '--st4', '--st5'][i]), data: dist.map(d => d.q[i]) })));
    };
    return { html, draw, alerts: alerts.length };
  };
  const nal = acctSection(6, 'NAL', 'NAL forecast, coverage and top 5 by RAD', r => r.sid, r => r.acct, 'end-user account matched by Siebel ID, then name');
  const mpl = acctSection(7, 'MPL', 'MPL forecast, coverage and top 5 by RAD', r => r.pid, r => r.partner, 'channel partner matched by Siebel ID, then name');
  out.push(nal.html, mpl.html);

  // ----- 8. -F placeholders: virtual numbers waiting to turn real -----
  const FP = pipe.filter(r => isF(r) && ['Secure', 'Validate', 'Qualify', 'Identify'].includes(r.stage) && r.q >= S.curQ);
  const fQs = [...new Set(FP.map(r => r.q))].sort(), fSt = ['Secure', 'Validate', 'Qualify', 'Identify'].filter(s => FP.some(r => r.stage === s));
  const fOpps = ENG.group(FP, r => r.opp);
  const fTot = ENG.total(FP), fCur = ENG.total(FP.filter(r => r.q === S.curQ));
  out.push(`<section class="blk" id="s8"><div class="bh"><span class="n">08</span><h2>-F placeholders waiting to turn real</h2><span class="note">${esc(S.curQ)} onward · open stages · name ends in -F · not counted in business totals</span></div>
    <div class="tiles"><div class="tile hero"><span>Total -F (virtual)</span><b>${kfmt(fTot)}</b><em>${fOpps.length} opportunities</em></div>
      ${fQs.map(q => `<div class="tile"><span>${q}</span><b>${kfmt(ENG.total(FP.filter(r => r.q === q)))}</b><em>${ENG.group(FP.filter(r => r.q === q), r => r.opp).length} opps</em></div>`).join('')}
      <div class="tile"><span>${esc(S.curQ)} -F already matched to POS</span><b>${kfmt(W.fConverted)}</b><em>of ${kfmt(fCur)} this quarter</em></div></div>
    <div>
      <div class="card"><h3>By quarter and stage</h3><div class="tbl"><table><thead><tr><th>Quarter</th>${fSt.map(s => `<th class="r">${s}</th>`).join('')}<th class="r">Total</th></tr></thead><tbody>
        ${fQs.map(q => `<tr><td>${q}</td>${fSt.map(s => `<td class="r">${money(ENG.total(FP.filter(r => r.q === q && r.stage === s)))}</td>`).join('')}<td class="r sec">${money(ENG.total(FP.filter(r => r.q === q)))}</td></tr>`).join('')}
        <tr class="tot"><td>Total</td>${fSt.map(s => `<td class="r">${money(ENG.total(FP.filter(r => r.stage === s)))}</td>`).join('')}<td class="r">${money(fTot)}</td></tr></tbody></table></div></div>
    </div></section>`);

  const openAlloc = $('#d-alloc')?.open;
  $('#out').innerHTML = out.join('');
  if (openAlloc) $('#d-alloc').open = true;
  const NAV = { s1: 'Week', s2: 'End users', s3: 'Partners', spl: 'Product lines', s4: 'Disti', s5: 'Software', srfid: 'RFID', s6: 'NAL', s7: 'MPL', s8: '-F' };
  const secs = [...document.querySelectorAll('#out section.blk')];
  secs.forEach((s, i) => { const n = s.querySelector('.bh .n'); if (n) n.textContent = String(i + 1).padStart(2, '0'); });
  $('#jump').innerHTML = secs.map((s, i) => `<a href="#${s.id}"><b>${i + 1}</b>${NAV[s.id] || s.id}${s.id === 's6' ? '<span class="badge" id="nal-badge" hidden></span>' : s.id === 's7' ? '<span class="badge" id="mpl-badge" hidden></span>' : ''}</a>`).join('');

  // draw charts
  charts['ch-pace']?.destroy();
  { const o = baseOpts(); o.interaction = { mode: 'index', intersect: false }; o.plugins.tooltip.callbacks.label = c => ` ${c.dataset.label}: ${money(c.parsed.y)}`;
    o.scales = { x: { grid: { display: false }, ticks: { color: css('--muted'), font: { family: css('--f-mono'), size: 11 } }, border: { color: css('--line') } },
      y: { beginAtZero: true, grid: { color: css('--line') }, border: { display: false }, ticks: { color: css('--muted'), callback: v => kfmt(v), maxTicksLimit: 5, font: { family: css('--f-mono'), size: 11 } } } };
    charts['ch-pace'] = new Chart($('#ch-pace'), { type: 'line', options: o, data: { labels: W.weekly.map(w => 'W' + w.wk), datasets: [
      { label: 'Cumulative POS', data: W.weekly.map(w => w.cum), borderColor: css('--s1'), backgroundColor: css('--s1'), borderWidth: 2, pointRadius: 4, pointBorderColor: css('--surface'), pointBorderWidth: 2, spanGaps: false },
      { label: 'Pace to target', data: W.weekly.map(w => w.pace), borderColor: css('--muted'), borderDash: [5, 4], borderWidth: 1.5, pointRadius: 0 }] } }); }
  euCards.forEach(c => c.draw()); ptCards.forEach(c => c.draw());
  charts['ch-dist']?.destroy();
  { const o = baseOpts(); o.cutout = '58%'; o.plugins.tooltip.callbacks.label = c => ` ${c.label}: ${money(c.parsed)} · ${pct(dAll ? c.parsed / dAll : null)}`;
    charts['ch-dist'] = new Chart($('#ch-dist'), { type: 'doughnut', options: o, plugins: [{ id: 'center', afterDraw(c) { const { ctx, chartArea: a } = c; ctx.save(); ctx.textAlign = 'center'; ctx.fillStyle = css('--ink'); ctx.font = '700 18px ' + css('--f-display'); ctx.fillText(kfmt(dAll), (a.left + a.right) / 2, (a.top + a.bottom) / 2 + 2); ctx.font = '11px ' + css('--f-body'); ctx.fillStyle = css('--muted'); ctx.fillText('Chinetek + VST', (a.left + a.right) / 2, (a.top + a.bottom) / 2 + 18); ctx.restore(); } }],
      data: { labels: DIST, datasets: [{ data: DIST.map(d => dTot[d]), backgroundColor: DIST.map(d => distCol[d]), borderColor: css('--surface'), borderWidth: 2 }] } }); }
  if (dPL.length) hbar('ch-distpl', dPL.map(x => x.key), DIST.map(d => ({ label: d, backgroundColor: distCol[d], data: dPL.map(x => x.sub.get(d) || 0) })));
  const qBar = (id, keys, colorOf, rows, keyFn) => hbar(id, fwdQs, keys.map(k => ({ label: k, backgroundColor: colorOf(k), data: fwdQs.map(q => ENG.total(rows.filter(r => r.q === q && keyFn(r) === k))) })).filter(d => d.data.some(v => v)));
  qBar('ch-plq', plKeys, k => plColor(k === 'Other lines' ? '' : k), PLQ, r => plName(r.pl));
  qBar('ch-distq', DIST, d => distCol[d], DQ, r => ENG.distOf(r));
  if (RF.length) qBar('ch-rfq', rfSub, rfColor, RF, r => r.psl || r.pl);
  if (swFam.length) hbar('ch-sw', swFam.map(x => x.key), [{ label: 'Software', backgroundColor: css('--s7'), data: swFam.map(x => x.amt) }]);
  nal.draw(); mpl.draw();
  for (const [b, x, l] of [['#nal-badge', nal, 'NAL'], ['#mpl-badge', mpl, 'MPL']]) { const nb = $(b); nb.hidden = !x.alerts; nb.textContent = x.alerts; nb.title = `${x.alerts} ${l} accounts without pipeline`; }
}

// match-key edits (section 1)
$('#out').addEventListener('change', e => {
  const i = e.target.closest('input.key'); if (!i) return;
  const v = i.value.trim().toUpperCase(); if (!v) return;
  S.keys[i.dataset.acct] = v; store.set('keys', S.keys); render();
  toast(`Match key for ${i.dataset.acct} set to ${v}.`);
});

// redraw on theme change so chart ink follows tokens
const rerender = () => render();
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', rerender);
new MutationObserver(rerender).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

Chart.defaults.font.family = getComputedStyle(document.documentElement).getPropertyValue('--f-body');
render();
})();
</script>

</body>
</html>
