<!doctype html>
<html lang="zh-Hant-HK">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HK PC Price Check</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: same working surface as the order check. Data strip → tabs → query row → dense table; history opens in a side sheet. */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --sunk: #e9edf1;
  --ink: #15212c;
  --ink-2: #4f5f6e;
  --ink-3: #7b8896;
  --line: #d9dfe5;
  --accent: #1d5cc2;
  --accent-ink: #ffffff;
  --accent-soft: #e3ecfa;
  /* decision states: full uplift / reduced (RP) uplift / no history */
  --s-full: #eb6834;
  --s-repeat: #1baf7a;
  --s-new: #b9c1c9;
  --spark: #2a78d6;
  --warn-bg: #fff3d6;
  --warn-ink: #7a5300;
  --bad-ink: #b42d2d;
  --good-ink: #136c2e;
  --shadow: 0 8px 30px rgba(21, 33, 44, .16);
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", "PingFang HK", "Microsoft JhengHei", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171d; --surface: #182029; --sunk: #1f2933; --ink: #e7edf3; --ink-2: #a9b6c3; --ink-3: #7d8a97;
    --line: #2b3742; --accent: #6ea2f0; --accent-ink: #0d1620; --accent-soft: #1d2d45;
    --s-full: #d95926; --s-repeat: #199e70; --s-new: #4a5662; --spark: #3987e5;
    --warn-bg: #3a2e12; --warn-ink: #f2c35b; --bad-ink: #f08080; --good-ink: #6fd08c;
    --shadow: 0 8px 30px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171d; --surface: #182029; --sunk: #1f2933; --ink: #e7edf3; --ink-2: #a9b6c3; --ink-3: #7d8a97;
  --line: #2b3742; --accent: #6ea2f0; --accent-ink: #0d1620; --accent-soft: #1d2d45;
  --s-full: #d95926; --s-repeat: #199e70; --s-new: #4a5662; --spark: #3987e5;
  --warn-bg: #3a2e12; --warn-ink: #f2c35b; --bad-ink: #f08080; --good-ink: #6fd08c;
  --shadow: 0 8px 30px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-body); margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 48px;
}
.wrap { max-width: 1440px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.wrap > * { min-width: 0; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: .01em; }
h1 { font-size: 1.6rem; font-weight: 700; }
h2 { font-size: 1.1rem; font-weight: 600; }
h3 { font-size: 1rem; font-weight: 600; }
.mono { font-family: var(--f-mono); font-size: .86em; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: .82rem; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.up { color: var(--bad-ink); }
.down { color: var(--good-ink); }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.label { font-family: var(--f-display); font-size: .74rem; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); }

.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.top .sub { color: var(--ink-2); margin-top: 2px; }
.top .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 12px; font-weight: 500; text-decoration: none; color: var(--ink); display: inline-block; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { padding: 4px 9px; font-size: .86rem; }

.fresh { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.fresh > div { background: var(--surface); padding: 10px 12px; min-width: 0; }
.fresh .v { font-weight: 600; font-variant-numeric: tabular-nums; }
.fresh .f { font-size: .8rem; color: var(--ink-3); overflow-wrap: anywhere; }
.notice { background: var(--warn-bg); color: var(--warn-ink); border-radius: 8px; padding: 9px 12px; font-size: .9rem; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 9px 14px; font-family: var(--f-display); font-weight: 600; font-size: .98rem; color: var(--ink-2); border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

.query { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px 16px; align-items: start; }
.query .field { display: grid; gap: 4px; min-width: 0; }
.query input[type=search], .query textarea, .rules input, .rules select {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 10px;
}
.query textarea { min-height: 76px; height: 76px; resize: vertical; font-family: var(--f-mono); font-size: .86rem; }
.query .opts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.query label.chk { display: inline-flex; gap: 6px; align-items: center; color: var(--ink-2); }
@media (max-width: 720px) { .query { grid-template-columns: minmax(0, 1fr); } }

.picks { display: flex; flex-wrap: wrap; gap: 6px; }
.pick { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 10px; text-align: left; display: grid; gap: 0; max-width: 100%; }
.pick:hover { border-color: var(--ink-3); }
.pick[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.pick .pn { font-weight: 600; overflow-wrap: anywhere; }
.pick .pd { font-size: .78rem; color: var(--ink-3); }

.head { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; }
.head .row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; align-items: baseline; }
.kpis { display: flex; flex-wrap: wrap; gap: 8px 28px; }
.kpi .v { font-family: var(--f-display); font-size: 1.35rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.kpi .st { font-size: .82rem; }

.tablebox { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 900px; }
th, td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; text-align: left; }
th { font-family: var(--f-display); font-weight: 600; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); background: var(--surface); position: sticky; top: 0; z-index: 1; white-space: nowrap; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: var(--sunk); }
td .pn { font-weight: 600; overflow-wrap: anywhere; }
td .sub { font-size: .8rem; color: var(--ink-3); }
tr.dim td { color: var(--ink-3); }
tr.dim td .pn { font-weight: 500; }
.big { font-weight: 600; font-size: 1.02rem; }
.empty { padding: 32px 16px; text-align: center; color: var(--ink-2); }
.more { padding: 12px; text-align: center; }

.st { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 500; white-space: nowrap; }
.st::before { content: ""; width: 9px; height: 9px; border-radius: 2px; background: var(--c, var(--s-new)); flex: none; }
.st.full { --c: var(--s-full); }
.st.repeat { --c: var(--s-repeat); }
.st.new, .st.norule { --c: var(--s-new); }
.steps { margin: 4px 0 0; padding-left: 16px; font-size: .78rem; color: var(--ink-2); }
.tag { display: inline-block; font-size: .72rem; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--ink-2); margin: 2px 4px 0 0; white-space: nowrap; }
.tag.warn { border-color: var(--warn-ink); color: var(--warn-ink); }
.tag.good { border-color: var(--good-ink); color: var(--good-ink); }
.tag.bad { border-color: var(--bad-ink); color: var(--bad-ink); }
svg.spark { display: block; overflow: visible; }
svg.spark path { fill: none; stroke: var(--spark); stroke-width: 1.5; }
svg.spark circle { fill: var(--spark); }

.sheet-bg { position: fixed; inset: 0; background: rgba(10, 16, 22, .35); z-index: 20; }
.sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100%); background: var(--surface); z-index: 21; box-shadow: var(--shadow); overflow-y: auto;
  padding: calc(18px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) 20px; display: grid; gap: 16px; align-content: start; }
.sheet .close { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); }
.sheet table { min-width: 520px; font-size: .88rem; }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: .9rem; }
.facts dt { color: var(--ink-3); }
.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.reco { background: var(--sunk); border-radius: 8px; padding: 12px 14px; display: grid; gap: 4px; }

.rules { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; display: grid; gap: 16px; }
.rules .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px 16px; }
.rules .grid label { display: grid; gap: 4px; }
.rules table { min-width: 640px; }
.rules td input { width: 80px; text-align: right; }
.rules th input { display: block; width: 140px; margin: 0 0 4px auto; font-family: var(--f-body); text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--ink); border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 4px 6px; }
.rules th .btn { font-family: var(--f-body); text-transform: none; letter-spacing: 0; }
.rules p, .rules li { max-width: 78ch; }
.rules ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }

.drop { position: fixed; inset: 0; z-index: 40; background: color-mix(in srgb, var(--accent) 18%, transparent); display: grid; place-items: center; }
.drop div { background: var(--surface); border: 2px dashed var(--accent); border-radius: 12px; padding: 28px 36px; font-family: var(--f-display); font-size: 1.2rem; font-weight: 600; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 8px; z-index: 50; max-width: calc(100% - 32px); }
/* table tools row */
.tools { display: flex; justify-content: flex-end; gap: 8px; }
.start { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 22px; display: grid; gap: 12px; max-width: 760px; }
.start ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.start .actions { display: flex; flex-wrap: wrap; gap: 8px; }

@media (max-width: 640px) { h1 { font-size: 1.3rem; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>HK PC Price Check</h1>
      <div class="sub">做 PC 前查一查：上次特價幾多、上次有冇加過價、今次應該加幾多。</div>
    </div>
    <div class="actions">
      <input id="fileInput" type="file" accept=".xls,.xlsx,.htm,.html" hidden>
      <button class="btn primary" id="uploadBtn">上載 PC list</button>
      <a class="btn" href="index.html" id="orderLink">Order Check</a>
    </div>
  </header>

  <section class="fresh" id="fresh" aria-label="已載入資料" hidden></section>
  <div class="notice" id="notice" hidden></div>

  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="view"></main>
</div>

<div class="sheet-bg" id="sheetBg" hidden></div>
<aside class="sheet" id="sheet" hidden aria-label="PC 紀錄"></aside>
<div class="drop" id="drop" hidden><div>放低 SFDC PC list (.xls)</div></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="pc-engine.js"></script>
<script>
(function () {
  'use strict';
  var E = window.PcEngine;
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var fmtD = function (d) { return d ? d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', timeZone: 'UTC' }) : '—'; };
  var fmtDs = function (d) { return d ? d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: '2-digit', timeZone: 'UTC' }) : '—'; };
  var usd = function (n) { return n == null ? '—' : '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
  var pctS = function (x, dp) { if (x == null || isNaN(x)) return '—'; var v = x * 100; return (v > 0 ? '+' : '') + v.toFixed(dp == null ? 1 : dp) + '%'; };
  var pctPlain = function (x) { return x == null || isNaN(x) ? '—' : (x * 100).toFixed(1) + '%'; };
  var cls = function (x) { return x == null || Math.abs(x) < 0.0005 ? '' : x > 0 ? 'up' : 'down'; };

  var CAT_LABEL = {};
  E.CATEGORIES.forEach(function (c) { CAT_LABEL[c.id] = c.label; });
  var STATE = {
    full: { label: '未加過價 → 全額加', short: '全額加' },
    repeat: { label: '已加過價 → RP 加少啲', short: 'RP 加少啲' },
    new: { label: '冇 PC 紀錄', short: '新產品' },
    norule: { label: '冇加價規則 → 參考牌價', short: '冇規則' }
  };
  // How each price-increase event was treated for this customer + part.
  function stepText(x, short) {
    var ev = x.event.label;
    if (x.kind === 'pending') return ev + '：上次 PC 喺加價前 → +' + x.rate + '%';
    if (x.kind === 'notRaised') return ev + '：加價後做過 PC 但冇加價' + (short ? '' : '（' + usd(x.base.unit) + ' → ' + usd(x.base.unit * (1 + x.lift)) + '）') + ' → +' + x.rate + '%';
    if (x.kind === 'early') return ev + '：之前已提前加 ' + pctS(x.lift) + ' → RP +' + x.rate + '%';
    if (x.kind === 'raised') return ev + '：已加過 ' + pctS(x.lift) + (short ? '' : '（對比 ' + fmtDs(x.base.created) + ' ' + usd(x.base.unit) + '）');
    return ev + '：第一張 PC 已按新牌價做';
  }
  function eventsSorted() {
    return (S.rules.events || []).slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  }
  function latestEventDate() {
    var ev = eventsSorted();
    return ev.length ? E.date(ev[ev.length - 1].date) : null;
  }
  var STATUS_TAG = { approved: '', pending: 'warn', notgranted: 'bad' };
  var STATUS_ZH = { 'Approved': '已批', 'Expired': '已批 (過期)', 'Pending': '審批中', 'Awaiting Approval': '審批中',
    'Expired before Approval': '未批已過期', 'Rejected': '拒絕', 'Cancelled': '取消' };

  // ------------------------------------------------------------ storage
  var LS = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } }
  };
  var IDB = {
    open: function () {
      return new Promise(function (res, rej) {
        try {
          var r = indexedDB.open('zebra-hk-pc-check', 1);
          r.onupgradeneeded = function () { r.result.createObjectStore('kv'); };
          r.onsuccess = function () { res(r.result); };
          r.onerror = function () { rej(r.error); };
        } catch (e) { rej(e); }
      });
    },
    get: function (k) {
      return IDB.open().then(function (db) {
        return new Promise(function (res) {
          var q = db.transaction('kv').objectStore('kv').get(k);
          q.onsuccess = function () { res(q.result); };
          q.onerror = function () { res(undefined); };
        });
      }).catch(function () { return undefined; });
    },
    set: function (k, v) {
      return IDB.open().then(function (db) {
        return new Promise(function (res) {
          var tx = db.transaction('kv', 'readwrite');
          tx.objectStore('kv').put(v, k);
          tx.oncomplete = function () { res(true); };
          tx.onerror = function () { res(false); };
        });
      }).catch(function () { return false; });
    }
  };

  function defaultRules() { return JSON.parse(JSON.stringify(E.DEFAULT_RULES)); }
  function loadRules() {
    var r = defaultRules(), saved = LS.get('zpc.rules.v3', null);
    if (!saved) {
      // v2 defaults wrongly put MC33XXR / TC22R in the March 2026 increase.
      saved = LS.get('zpc.rules.v2', null);
      (saved && saved.events || []).forEach(function (e) { if (e.id === 'e2026-03' && e.rates) delete e.rates.rfid15; });
    }
    if (saved) {
      ['liftFrom', 'liftThreshold', 'includePending', 'events', 'rp'].forEach(function (k) { if (saved[k] !== undefined) r[k] = saved[k]; });
    }
    return r;
  }

  // ------------------------------------------------------------ state
  var S = {
    rows: [], idx: null, meta: null, sample: false,
    tab: LS.get('zpc.tab', 'check'),
    acct: LS.get('zpc.acct', ''),
    acctQ: '',
    parts: LS.get('zpc.parts', ''),
    part: LS.get('zpc.part', ''),
    partQ: '',
    onlyGranted: LS.get('zpc.onlyGranted', true),
    rules: loadRules(),
    cur: [],
    limit: 300
  };
  S.partQ = S.part;

  // ------------------------------------------------------------ file reading
  function readFile(file) {
    return file.arrayBuffer().then(function (buf) {
      var head = new TextDecoder().decode(buf.slice(0, 400)).replace(/^﻿/, '').trimStart();
      var grids = [];
      if (head.charAt(0) === '<') {
        // SFDC "xls" exports are HTML tables
        var html = new TextDecoder('windows-1252').decode(buf);
        var doc = new DOMParser().parseFromString(html, 'text/html');
        doc.querySelectorAll('table').forEach(function (t) {
          grids.push(Array.prototype.map.call(t.rows, function (tr) {
            return Array.prototype.map.call(tr.cells, function (c) { var v = c.textContent.trim(); return v === '' ? null : v; });
          }));
        });
      } else {
        if (!window.XLSX) throw new Error('Excel reader 未載入，請檢查網絡後重新整理。');
        var wb = XLSX.read(buf, { type: 'array', cellDates: true });
        wb.SheetNames.forEach(function (n) {
          grids.push(XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: null }));
        });
      }
      for (var i = 0; i < grids.length; i++) {
        var t = E.tableFromGrid(grids[i], file.name);
        if (t) return t;
      }
      throw new Error(file.name + '：唔係 PC list（搵唔到 "PC #"、"Price Concession Name"、"Unit Special Price (converted)" 欄）。');
    });
  }
  function handleFiles(files) {
    var f = files && files[0];
    if (!f) return;
    toast('讀取 ' + f.name + '…');
    readFile(f).then(function (t) {
      var rows = E.normPc(t);
      if (!rows.length) throw new Error(f.name + '：冇可用的 PC 行。');
      var meta = { name: f.name, loadedAt: new Date().toISOString(), raw: t.rows.length };
      S.sample = false;
      setData(rows, meta);
      IDB.set('pc', { rows: rows, meta: meta });
      toast('已載入 ' + rows.length.toLocaleString() + ' 行 PC', 4000);
    }).catch(function (e) { toast(e.message || String(e), 7000); });
  }
  function setData(rows, meta) {
    S.rows = rows;
    S.meta = meta;
    S.idx = E.buildIndex(rows);
    if (S.acct && !S.idx.byAcct[S.acct]) S.acct = '';
    render();
  }

  // Synthetic demo rows so the page shows what it does before an upload.
  function sampleRows() {
    var H = ['PC #', 'Price Concession Name', 'Unit Special Price (converted)', 'Price Concession: Created Date', 'Status',
      'Siebel Account Number', 'Account Name', 'Reseller', 'Distributor', 'Product: Product Conversion Source', 'Product Line',
      'Product: Product Sub Line', 'Product Family', 'Line Item Reseller: Product', 'Min Qty', 'Max Qty', 'Siebel List Price (converted)'];
    var P = {

  function spark(h) {
    if (h.length < 2) return '<span class="faint small">只有一次</span>';
    var w = 120, ht = 26, xs = h.map(function (r) { return +r.created; }), ys = h.map(function (r) { return r.unit; });
    var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs), y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
    var X = function (v) { return x1 === x0 ? w / 2 : 3 + (v - x0) / (x1 - x0) * (w - 6); };
    var Y = function (v) { return y1 === y0 ? ht / 2 : ht - 3 - (v - y0) / (y1 - y0) * (ht - 6); };
    var d = h.map(function (r, i) { return (i ? 'L' : 'M') + X(+r.created).toFixed(1) + ' ' + Y(r.unit).toFixed(1); }).join(' ');
    var l = h[h.length - 1];
    return '<svg class="spark" width="' + w + '" height="' + ht + '" viewBox="0 0 ' + w + ' ' + ht + '" role="img" aria-label="特價由 ' + usd(h[0].unit) + ' 到 ' + usd(l.unit) + '">' +
      '<path d="' + d + '"/><circle cx="' + X(+l.created).toFixed(1) + '" cy="' + Y(l.unit).toFixed(1) + '" r="2.5"/></svg>';
  }

    var v = function (x) { return x == null || x === '' ? '' : x; };
    var head = evs.map(function (e) {
      return '<th class="num"><input type="text" class="evlabel" data-ev="' + esc(e.id) + '|label" value="' + esc(e.label) + '" aria-label="加價名稱">' +
        '<input type="date" data-ev="' + esc(e.id) + '|date" value="' + esc(e.date) + '" aria-label="生效日">' +
        '<button class="btn small" data-delev="' + esc(e.id) + '">刪除</button></th>';
    }).join('');
    var rows = E.CATEGORIES.map(function (c) {
      return '<tr><td>' + esc(c.label) + '</td>' + evs.map(function (e) {
        return '<td class="num"><input type="number" step="0.1" data-evrate="' + esc(e.id) + '|' + c.id + '" value="' + v(e.rates[c.id]) + '" placeholder="—"> %</td>';
      }).join('') + '<td class="num"><input type="number" step="0.1" data-rp="' + c.id + '" value="' + v(R.rp[c.id]) + '" placeholder="—"> %</td></tr>';
    }).join('');
    return '<section class="rules">' +
      '<div><h2>點計</h2><ul class="small muted">' +
      '<li>用客戶 + 產品最近一張已批的 PC（「上次 PC」）做基準，逐個加價日檢查：</li>' +
      '<li><b>上次 PC 喺加價日之前</b> → 呢次加價未轉嫁，加該欄 %。</li>' +
      '<li><b>上次 PC 喺加價日之後</b> → 對比加價日前最後一張 PC：特價有升（≥ 下面門檻）= 已加過；冇升 = 加價後做過 PC 但冇加價，照加該欄 %。加價日前冇 PC = 第一張已按新牌價做。</li>' +
      '<li>幾個加價日都未轉嫁就連乘（例如 15% 再 15% = 32.25%）。全部都已加過 → 用 RP 欄。</li>' +
      '<li>上次 PC 喺加價日前、但今年已經比之前一張 PC 加咗價（例如 ADC 提前加 2%）→ 嗰次加價用 RP 欄（ADC +1%，累計約 3%）。</li>' +
      '<li>欄位留空 = 呢個分類冇呢次加價。全部留空嘅分類 = 冇規則，改用上次 PC 至今牌價變動做參考。</li></ul></div>' +
      '<div class="grid">' +
      '<label><span class="label">提前加價由幾時起計</span><input type="date" id="rFrom" value="' + esc(R.liftFrom) + '"></label>' +
      '<label><span class="label">特價上升最少（%）當加過</span><input type="number" step="0.1" id="rThr" value="' + esc(R.liftThreshold) + '"></label></div>' +
      '<div class="tablebox"><table><thead><tr><th>產品分類</th>' + head + '<th class="num">已加過 → RP</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<div class="tools" style="justify-content:flex-start"><button class="btn" id="addEvent">新增加價日</button><button class="btn" id="resetRules">還原預設</button></div>' +
      '<div><h3>預設值來源</h3><ul class="small muted">' +
      '<li>2026-10-05：EMC 15%、AIT 3%、ADC 4%、RFID Fixed / HH 5%、MC33XXR / TC22R 15%，來自你提供的加價表。PC list 入面的牌價喺 10 月都有相同升幅。</li>' +
      '<li>2026-03-19：PC list 入面第一張用新 EMC 牌價（+15%）的 PC 喺 2026-03-19。呢次只計 EMC，RFID HH（包括 MC33XXR / TC22R）唔加。</li>' +
      '<li>RP：EMC 15%（margin 夠可以少啲，要問 Kevin）、RFID 3%、打印機 1%、ADC 1%，來自你提供的規則。</li>' +
      '<li>EMC 配件、服務 (OneCare)、RFID OH readers 未有規則。PC list 見到 EMC 配件喺 2026-02 同 2026-10 各升咗 5%，但未經你確認，所以冇預設。</li>' +
      '<li>標準淨價 = 最新牌價 × (1 − PC list 的「Discount」)。Discount 按產品同 Fulfillment Type（VAD / Direct to Partner）唔同，用同一 Fulfillment Type 最新一張 PC 的數。</li>' +
      '</ul></div></section>';
  }

  // ------------------------------------------------------------ side sheet
  function openSheet(acctKey, partNo) {
    var hist = (S.idx.byAcct[acctKey] || []).filter(function (r) { return r.part === partNo; });
    var res = E.assess(S.idx, hist, S.rules, partNo);
    var acct = S.idx.accounts.filter(function (a) { return a.key === acctKey; })[0];
    var inf = S.idx.info[partNo];
    var others = E.otherCustomers(S.idx, partNo, acctKey, S.rules).slice(0, 12);
    var h = '<button class="btn small close" id="closeSheet">關閉</button>' +
      '<div><div class="label">' + esc(acct ? acct.name : '') + '</div><h2 class="mono">' + esc(partNo) + '</h2>' +
      '<div class="small muted">' + (inf ? esc(inf.line + ' · ' + inf.subLine + ' · ' + inf.family) + ' · ' + esc(CAT_LABEL[inf.cat]) : '') + '</div></div>';
    if (res.state !== 'new') {
      h += '<div class="reco"><div><span class="st ' + res.state + '">' + STATE[res.state].label + '</span></div>' +
        (res.steps.length ? '<ul class="steps">' + res.steps.map(function (x) { return '<li>' + esc(stepText(x)) + '</li>'; }).join('') + '</ul>' : '') +
        (res.cat === 'emc' ? '<div class="small muted">EMC 正常加 15%；如果 margin 夠可以加少啲，margin 數據要問 Kevin。</div>' : '') +
        (res.rate != null ? '<div>建議加 <b>' + (res.rate > 0 ? '+' : '') + res.rate + '%</b>' + (res.rateSource === 'list' ? '（冇規則，按牌價變動）' : '') +
          '：' + usd(res.last.unit) + ' → <b>' + usd(res.suggested) + '</b>' + (res.cumulative != null ? '，比 ' + fmtDs(res.cumulativeBase.created) + ' 的 ' + usd(res.cumulativeBase.unit) + ' 累計 ' + pctS(res.cumulative) : '') + '</div>' : '<div>呢個分類冇規則，亦冇牌價變動資料。</div>') +
        (res.newStdNet != null ? '<div class="small">新標準淨價 ' + usd(res.newStdNet) + '（牌價 ' + usd(res.latest.list) + ' × (1 − ' + res.latest.stdDisc + '%)）' +
          (res.aboveStd ? '：<b class="up">建議特價已經 ≥ 標準淨價，用標準價就得，唔使做 PC。</b>' : '：建議特價比標準淨價低 ' + pctPlain(1 - res.suggested / res.newStdNet) + '。') + '</div>' : '') +
        (res.latest ? '<div class="small muted">最新牌價 ' + usd(res.latest.list) + '（PC ' + esc(res.latest.pc) + '，' + fmtDs(res.latest.date) + (listStale(res) ? '，喺加價生效日之前，可能已經過時' : '') + '）' +
          (res.newDisc != null ? '，建議特價折扣 ' + pctPlain(res.newDisc) : '') + '</div>' : '') + '</div>';
    } else h += '<div class="reco"><span class="st new">' + STATE.new.label + '</span><div class="small">呢個客戶未有已批的 PC，可以參考下面其他客戶的價錢。</div>' +
      (res.latest && res.latest.stdDisc != null ? '<div class="small">最新牌價 ' + usd(res.latest.list) + '，Std disc ' + res.latest.stdDisc + '%，標準淨價 ' + usd(res.latest.list * (1 - res.latest.stdDisc / 100)) + '</div>' : '') + '</div>';
    h += '<div><h3>呢個客戶的 PC 紀錄</h3></div>' + miniTable(res.history.length ? hist : [], false);
    h += '<div><h3>其他客戶最近已批特價</h3></div>' + miniTable(others, true);
    var sh = $('#sheet');
    sh.innerHTML = h;
    sh.hidden = false;
    $('#sheetBg').hidden = false;
    sh.scrollTop = 0;
    $('#closeSheet').focus();
  }
  function miniTable(rows, cust) {
    if (!rows.length) return '<div class="faint small">冇。</div>';
    return '<div class="tablebox"><table><thead><tr><th class="num">日期</th><th>PC #</th>' + (cust ? '<th>客戶</th>' : '<th>狀態</th>') +
      '<th class="num">數量</th><th class="num">牌價</th><th class="num">特價</th><th class="num">折扣</th></tr></thead><tbody>' +
      rows.map(function (r) {
        return '<tr class="' + (r.statusGroup === 'approved' ? '' : 'dim') + '"><td class="num">' + fmtDs(r.created) + '</td><td class="mono">' + esc(r.pc) + '</td>' +
          (cust ? '<td>' + esc(r.account) + '</td>' : '<td><span class="tag ' + STATUS_TAG[r.statusGroup] + '">' + esc(STATUS_ZH[r.status] || r.status) + '</span></td>') +
          '<td class="num">' + qtyS(r) + '</td><td class="num">' + usd(r.list) + '</td><td class="num"><b>' + usd(r.unit) + '</b></td><td class="num">' + pctPlain(r.list ? 1 - r.unit / r.list : null) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }
  function closeSheet() { $('#sheet').hidden = true; $('#sheetBg').hidden = true; }

  // ------------------------------------------------------------ copy
  function copyTable() {
    var head = ['Part', 'Family', '分類', '上次 PC', '上次 PC 日期', '上次特價', '再之前特價', '變動', '判斷', '原因', '建議加幅 %', '加幅來源', '建議特價', '最新牌價', 'Std disc %', '標準淨價'];
    var lines = [head].concat(S.cur.map(function (r) {
      return [r.part, r.info ? r.info.family : '', r.info ? CAT_LABEL[r.info.cat] : '', r.last ? r.last.pc : '', r.last ? E.iso(r.last.created) : '',
        r.last ? r.last.unit : '', r.prev ? r.prev.unit : '', r.lift != null ? (r.lift * 100).toFixed(2) + '%' : '', STATE[r.state].short,
        r.steps.map(function (x) { return stepText(x, true); }).join('；'),
        r.rate != null ? r.rate : '', r.rateSource === 'list' ? '牌價變動' : r.rateSource === 'rule' ? '規則' : '', r.suggested != null ? r.suggested : '',
        r.latest ? r.latest.list : '', r.latest && r.latest.stdDisc != null ? r.latest.stdDisc : '', r.newStdNet != null ? r.newStdNet : ''];
    }));
    var tsv = lines.map(function (l) { return l.join('\t'); }).join('\n');
    var done = function () { toast('已複製，可以貼去 Excel。'); };
    var fallback = function () {
      var ta = document.createElement('textarea');
      ta.value = tsv; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { toast('瀏覽器唔俾複製，請手動選取表格。'); }
      ta.remove();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(tsv).then(done, fallback);
    else fallback();
  }

  // ------------------------------------------------------------ toast
  var toastT;
  function toast(msg, ms) {
    var t = $('#toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, ms || 2600);
  }

  // ------------------------------------------------------------ events
  function saveRules() { LS.set('zpc.rules.v3', S.rules); renderFresh(); }
  function setAcct(k) {
    S.acct = k; S.acctQ = ''; LS.set('zpc.acct', k);
    renderView();
  }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('button, tr.click');
    if (!t) return;
    if (t.id === 'uploadBtn' || t.id === 'uploadBtn2') return $('#fileInput').click();
    if (t.id === 'demoBtn') { S.sample = true; setData(sampleRows(), { name: 'demo' }); S.acct = 'DEMO1'; S.tab = 'check'; return render(); }
    if (t.id === 'closeSheet') return closeSheet();
    if (t.id === 'copyBtn') return copyTable();
    if (t.id === 'moreBtn') { S.limit = 1e9; return renderView(); }
    if (t.id === 'addEvent') {
      S.rules.events.push({ id: 'e' + Date.now(), label: '新加價', date: new Date().toISOString().slice(0, 10), rates: {} });
      saveRules(); return renderView();
    }
    if (t.dataset.delev) {
      S.rules.events = S.rules.events.filter(function (e) { return e.id !== t.dataset.delev; });
      saveRules(); toast('已刪除加價日'); return renderView();
    }
    if (t.id === 'resetRules') { S.rules = defaultRules(); saveRules(); toast('已還原預設規則'); return renderView(); }
    if (t.dataset.tab) { S.tab = t.dataset.tab; LS.set('zpc.tab', S.tab); S.limit = 300; renderTabs(); return renderView(); }
    if (t.dataset.acct) return setAcct(t.dataset.acct);
    if (t.hasAttribute('data-clearacct')) { S.acct = ''; S.acctQ = ''; LS.set('zpc.acct', ''); renderView(); var i = document.querySelector('[data-acctq]'); if (i) i.focus(); return; }
    if (t.dataset.part) { S.part = t.dataset.part; LS.set('zpc.part', S.part); return renderView(); }
    if (t.dataset.row != null) { var r = S.cur[+t.dataset.row]; if (r) openSheet(S.acct, r.part); return; }
    if (t.dataset.crow != null) { var c = S.cur[+t.dataset.crow]; if (c) openSheet(S.acct, c.part); return; }
    if (t.dataset.pcrow != null) { var p = S.cur[+t.dataset.pcrow]; if (p) openSheet(p.acctKey, p.part); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeSheet();
    if (e.key === 'Enter' && e.target.matches && e.target.matches('tr.click')) e.target.click();
  });
  $('#sheetBg').addEventListener('click', closeSheet);
  document.addEventListener('change', function (e) {
    var t = e.target, id = t.id;
    if (id === 'fileInput') { handleFiles(t.files); t.value = ''; return; }
    if (id === 'optPending') { S.rules.includePending = t.checked; saveRules(); return renderView(); }
    if (id === 'optGranted') { S.onlyGranted = t.checked; LS.set('zpc.onlyGranted', S.onlyGranted); return renderView(); }
    if (id === 'rFrom') { S.rules.liftFrom = t.value; return saveRules(); }
    if (id === 'rThr') { S.rules.liftThreshold = t.value === '' ? 0 : +t.value; return saveRules(); }
    var ev = function (id) { return S.rules.events.filter(function (e) { return e.id === id; })[0]; };
    if (t.dataset.evrate) {
      var k = t.dataset.evrate.split('|'), e1 = ev(k[0]);
      if (e1) { if (t.value === '') delete e1.rates[k[1]]; else e1.rates[k[1]] = +t.value; }
      return saveRules();
    }
    if (t.dataset.ev) {
      var k2 = t.dataset.ev.split('|'), e2 = ev(k2[0]);
      if (e2) e2[k2[1]] = t.value;
      saveRules();
      return k2[1] === 'date' ? renderView() : undefined;
    }
    if (t.dataset.rp) {
      if (t.value === '') delete S.rules.rp[t.dataset.rp]; else S.rules.rp[t.dataset.rp] = +t.value;
      return saveRules();
    }
  });
  // Re-render while typing, then put the caret back where it was.
  var qT;
  function refocus(sel, pos) {
    var el = document.querySelector(sel);
    if (!el) return;
    el.focus();
    try { el.setSelectionRange(pos, pos); } catch (err) { /* not a text field */ }
  }
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.hasAttribute('data-acctq')) {
      clearTimeout(qT);
      qT = setTimeout(function () {
        var pos = t.selectionStart;
        S.acctQ = t.value;
        if (S.acct) { S.acct = ''; LS.set('zpc.acct', ''); }
        var m = acctMatches();
        if (m.length === 1 && S.acctQ.trim().length >= 3 && (m[0].no === S.acctQ.trim() || m[0].name.toUpperCase() === S.acctQ.trim().toUpperCase())) { setAcct(m[0].key); return; }
        renderView();
        refocus('#' + t.id, pos);
      }, 200);
    } else if (t.id === 'pQ') {
      clearTimeout(qT);
      qT = setTimeout(function () {
        var pos = t.selectionStart;
        S.partQ = t.value; S.part = ''; S.limit = 300; LS.set('zpc.part', '');
        renderView();
        refocus('#pQ', pos);
      }, 200);
    } else if (t.id === 'cParts') {
      clearTimeout(qT);
      qT = setTimeout(function () {
        var pos = t.selectionStart;
        S.parts = t.value; LS.set('zpc.parts', S.parts);
        renderView();
        refocus('#cParts', pos);
      }, 500);
    }
  });
  var dragN = 0;
  window.addEventListener('dragenter', function (e) { if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types, 'Files') >= 0) { dragN++; $('#drop').hidden = false; } });
  window.addEventListener('dragleave', function () { if (--dragN <= 0) { dragN = 0; $('#drop').hidden = true; } });
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('drop', function (e) { e.preventDefault(); dragN = 0; $('#drop').hidden = true; handleFiles(e.dataTransfer.files); });

  // ------------------------------------------------------------ boot
  render();
  IDB.get('pc').then(function (saved) {
    if (saved && saved.rows && saved.rows.length) setData(saved.rows, saved.meta);
  });
})();
</script>
